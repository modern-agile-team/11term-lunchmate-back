services:
  lunchmate-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunchmate-backend
    expose:
      - '3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lunchmate-nginx
    restart: unless-stopped
    depends_on:
      - lunchmate-backend
    ports:
      - '80:80'
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf
